name: به‌روزرسانی خودکار اخبار

on:
  # زنجیرهٔ خودکار: هر اجرا، اجرای بعدی را ۱۳ دقیقه بعد شروع می‌کند
  workflow_dispatch:
  repository_dispatch:
    types: [update-news]
  # پشتیبان: اگر زمان‌بندی گیت‌هاب بالاخره فعال شود
  schedule:
    - cron: '*/15 * * * *'
  # راه‌اندازی اولیه/بازیابی با تغییر کد
  push:
    branches: [main]
    paths:
      - 'pipeline.mjs'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'index.html'
      - 'admin.html'
      - 'status.html'
      - 'sw.js'
      - 'Adult.m3u'
      - 'AdultVod.m3u'
      - 'settings.json'
      - 'vendor/**'
      - '.github/workflows/update.yml'

permissions:
  # نوشتن لازم است تا رکورد وضعیت زنجیره داخل مخزن ثبت شود.
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy-url.outputs.page_url }}
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: ثبت زمان شروع اجرا
        run: date -u +%Y-%m-%dT%H:%M:%SZ > .chain-start

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نگه‌داشتن حافظهٔ ترجمه بین اجراها
        uses: actions/cache@v4
        with:
          path: .cache
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-

      - name: تست زنجیرهٔ منابع نرخ
        run: npm test

      # تولید داده‌ها با سه تلاش و فاصلهٔ افزایشی؛ خطای موقت شبکه/منبع داده زنجیره را قطع نکند.
      - name: تولید داده‌ها
        id: pipeline
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: |
          set -u
          attempt=1
          max=3
          while [ "$attempt" -le "$max" ]; do
            echo "تلاش ${attempt} از ${max} برای تولید داده‌ها…"
            if node pipeline.mjs; then
              echo "$attempt" > .chain-data-attempts
              echo "تولید داده‌ها موفق بود."
              exit 0
            fi
            if [ "$attempt" -eq "$max" ]; then
              echo "$attempt" > .chain-data-attempts
              echo "تولید داده‌ها پس از ${max} تلاش ناموفق ماند." >&2
              exit 1
            fi
            wait_s=$((attempt * 30))
            echo "خطای موقت؛ ${wait_s} ثانیه صبر و تلاش دوباره…"
            sleep "$wait_s"
            attempt=$((attempt + 1))
          done

      - name: آماده‌سازی سایت
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp admin.html _site/
          cp status.html _site/
          cp sw.js _site/
          cp favicon.svg _site/
          cp Adult.m3u _site/
          cp AdultVod.m3u _site/
          cp data.json _site/
          cp news.xlsx _site/
          # صفحهٔ اصلی به همهٔ ۱۴۰۰ خبر و همهٔ داستان‌ها نیاز ندارد؛ فایل سبک آن جدا
          # ساخته می‌شود تا روی اتصال کند، بازشدن صفحه چند برابر سریع‌تر شود.
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('_site/data.json', 'utf8'));
          const byDate = (a, b) => new Date(b.published) - new Date(a.published);
          // فیلدهایی که صفحهٔ اصلی واقعاً می‌خواند؛ بقیه (کلیدواژه، عنوان خوشه، امتیازها) 
          // فقط حجم اضافه‌اند و از نسخهٔ سبک حذف می‌شوند.
          const ART_KEYS = ['uid', 'source_id', 'source_name', 'lang', 'title', 'title_fa', 'link',
            'telegram', 'summary', 'summary_fa', 'published', 'is_new', 'topics', 'sources', 'source_count'];
          const STORY_KEYS = ['title', 'title_fa', 'url', 'telegram', 'published', 'sentiment',
            'primary_source', 'source_count'];
          const trimArticle = (a) => {
            const out = {};
            ART_KEYS.forEach((key) => { if (a[key] !== undefined && a[key] !== null) out[key] = a[key]; });
            if (a.translation && a.translation.is_translation) out.translation = { is_translation: true };
            if (Array.isArray(out.topics)) out.topics = out.topics.map((t) => (t && typeof t === 'object' && t.name ? { name: t.name } : t));
            return out;
          };
          const trimStory = (s) => {
            const out = {};
            STORY_KEYS.forEach((key) => { if (s[key] !== undefined && s[key] !== null) out[key] = s[key]; });
            if (Array.isArray(s.sources)) out.sources = s.sources.map((src) => (src && src.name ? { name: src.name } : src));
            return out;
          };
          const articles = (data.articles || []).slice().sort(byDate).map(trimArticle);
          const HEAD = 200;   // همراه صفحهٔ اصلی
          const feed = {};
          ['generated_at', 'next_update_at', 'update_interval_minutes', 'stats', 'markets',
            'topics', 'translations', 'source_health', 'settings'].forEach((key) => {
            if (key in data) feed[key] = data[key];
          });
          feed.articles = articles.slice(0, HEAD);
          feed.stories = (data.stories || []).slice(0, 12).map(trimStory);
          // فهرست تلگرام (حدود ۲۰۰ کیلوبایت) فقط وقتی بخشش در دید بیاید در فایل جدا خوانده می‌شود.
          const telegram = data.telegram || {};
          feed.telegram = { posts: [], channels: Array.isArray(telegram.channels) ? telegram.channels : [], deferred: true };
          fs.writeFileSync('_site/feed.json', JSON.stringify(feed));
          // آرشیو به قطعه‌های ۵۰۰تایی شکسته می‌شود تا «نمایش بیشتر» هر بار فقط
          // یک قطعه را از سرور بگیرد و کل آرشیو قابل مرور بماند.
          const CHUNK = 500;
          const rest = articles.slice(HEAD);
          let chunks = 0;
          for (let i = 0; i * CHUNK < rest.length; i += 1) {
            chunks += 1;
            fs.writeFileSync('_site/feed-more-' + chunks + '.json', JSON.stringify({
              generated_at: data.generated_at,
              chunk: chunks,
              chunk_size: CHUNK,
              articles: rest.slice(i * CHUNK, (i + 1) * CHUNK)
            }));
          }
          console.log('archive chunks:', chunks, 'of', rest.length, 'articles');
          fs.writeFileSync('_site/telegram.json', JSON.stringify({
            generated_at: data.generated_at,
            telegram: { posts: Array.isArray(telegram.posts) ? telegram.posts : [], channels: Array.isArray(telegram.channels) ? telegram.channels : [] }
          }));
          // پنل مدیر و صفحهٔ وضعیت کل data.json (چند مگابایت) را نمی‌خواهند؛ هر صفحه
          // فایل سبک خودش را می‌گیرد: سلامت منابع برای وضعیت، خلاصهٔ کاری برای پنل مدیر.
          const HEALTH_KEYS = ['id', 'name', 'lang', 'ok', 'elapsed_ms', 'success_percent', 'count', 'error', 'via', 'mirror'];
          const health = (data.source_health || []).map((source) => {
            const out = {};
            HEALTH_KEYS.forEach((key) => { if (source[key] !== undefined && source[key] !== null) out[key] = source[key]; });
            return out;
          });
          fs.writeFileSync('_site/health.json', JSON.stringify({ generated_at: data.generated_at, source_health: health }));
          const STAT_KEYS = ['total', 'stories', 'multi_source_stories', 'fresh_24h', 'sources_ok', 'sources_total'];
          const summaryStats = {};
          STAT_KEYS.forEach((key) => { if (data.stats && data.stats[key] !== undefined) summaryStats[key] = data.stats[key]; });
          const marketItems = (Array.isArray(data.markets) ? data.markets : ((data.markets && data.markets.items) || [])).slice(0, 14)
            .map((item) => ({ label: item.label, value: item.value, unit: item.unit, change_percent: item.change_percent }));
          fs.writeFileSync('_site/summary.json', JSON.stringify({
            generated_at: data.generated_at,
            stats: summaryStats,
            topics: (data.topics || []).slice(0, 12).map((topic) => ({ name: topic.name, count: topic.count })),
            markets: { items: marketItems },
            summary_lines: (data.summary_lines || []).slice(0, 4),
            source_health: health,
            articles: articles.slice(0, 40).map((article) => ({
              title: article.title, title_fa: article.title_fa, source_name: article.source_name, published: article.published
            }))
          }));
          NODE
          ls -lh _site/feed.json _site/feed-more-*.json _site/telegram.json _site/summary.json _site/health.json
          # فهرست‌های پخش ماهواره به‌صورت محلی هم منتشر می‌شوند تا بازکردن این بخش به
          # میزبان‌های خارجی که از ایران کند یا بسته‌اند وابسته نباشد. اگر دانلود نشد،
          # سایت همان آینه‌های عمومی را امتحان می‌کند و چیزی نمی‌شکند.
          mkdir -p _site/sat/languages _site/sat/countries _site/sat/extra
          while read -r url dest; do
            ok=0
            for attempt in 1 2 3; do
              if curl -fsSL --max-time 45 "$url" -o "$dest"; then ok=1; break; fi
              sleep $((attempt * 10))
            done
            if [ "$ok" = "1" ]; then
              echo "فهرست محلی ساخته شد: $dest"
            else
              echo "دانلود $url ناموفق بود؛ از آینه‌های عمومی استفاده می‌شود." >&2
              rm -f "$dest"
            fi
          done <<'LIST'
          https://iptv-org.github.io/api/countries.json _site/sat/countries.json
          https://iptv-org.github.io/iptv/languages/fas.m3u _site/sat/languages/fas.m3u
          https://iptv-org.github.io/iptv/countries/ir.m3u _site/sat/countries/ir.m3u
          https://raw.githubusercontent.com/shayanline/iptv-iran/main/playlists/en/iran.m3u _site/sat/extra/shayanline.m3u
          https://raw.githubusercontent.com/shahram7/iranianiptv/main/playlist.m3u _site/sat/extra/shahram7.m3u
          https://raw.githubusercontent.com/mehrdad-dd/myiptv/main/core.m3u _site/sat/extra/myiptv.m3u
          https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_iran.m3u8 _site/sat/extra/freetv-iran.m3u
          LIST
          # گزارش وضعیت زنجیره از اجرای قبلی (اگر وجود داشته باشد) هم منتشر می‌شود.
          if [ -f chain-log.json ]; then cp chain-log.json _site/; fi
          cp -r vendor _site/
          mkdir -p _site/src
          cp src/hls-loader.js _site/src/
          printf '{"commit":"%s","built_at":"%s"}\n' "${GITHUB_SHA:0:7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          ls -lh _site

      - name: پیکربندی Pages
        uses: actions/configure-pages@v6

      # بارگذاری artifact هم تلاش دوباره دارد تا خطای موقت، انتشار را از دست ندهد.
      - name: بارگذاری artifact (تلاش ۱)
        id: artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: فاصله پیش از بارگذاری دوباره
        if: steps.artifact.outcome == 'failure'
        run: |
          echo "بارگذاری artifact ناموفق بود؛ ۳۰ ثانیه صبر…"
          sleep 30

      - name: بارگذاری artifact (تلاش ۲)
        id: artifact-retry
        if: steps.artifact.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # انتشار با سه تلاش و فاصلهٔ بین آن‌ها تا خطای موقت شبکه/سرویس، زنجیرهٔ خودکار را قطع نکند.
      - name: انتشار روی Pages (تلاش ۱)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: فاصله پیش از تلاش دوباره (۱)
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "تلاش اول انتشار ناموفق بود؛ ۴۵ ثانیه صبر…"
          sleep 45

      - name: انتشار روی Pages (تلاش ۲)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: فاصله پیش از تلاش دوباره (۲)
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: |
          echo "تلاش دوم انتشار هم ناموفق بود؛ ۹۰ ثانیه صبر…"
          sleep 90

      - name: انتشار روی Pages (تلاش ۳)
        id: deployment-final
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: ثبت آدرس منتشرشده
        id: deploy-url
        if: always()
        run: |
          url="${{ steps.deployment-final.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}"
          if [ -z "$url" ]; then
            # اگر هیچ تلاشی آدرس نداد، آدرس پیش‌فرض Pages همین مخزن ثبت می‌شود.
            url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "page_url=${url}" >> "$GITHUB_OUTPUT"
          printf 'آدرس منتشرشده: %s\n' "$url"

      - name: ثبت وضعیت زنجیره
        # حتی با شکست مراحل قبلی، وضعیت همین اجرا ثبت و منتشر می‌شود.
        if: ${{ !cancelled() }}
        env:
          LOG_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ secrets.NEWS_RADAR_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          DATA_OUTCOME: ${{ steps.pipeline.outcome }}
          ARTIFACT_1: ${{ steps.artifact.outcome }}
          ARTIFACT_2: ${{ steps.artifact-retry.outcome }}
          DEPLOY_1: ${{ steps.deployment.outcome }}
          DEPLOY_2: ${{ steps.deployment-retry.outcome }}
          DEPLOY_3: ${{ steps.deployment-final.outcome }}
          PAGE_URL: ${{ steps.deploy-url.outputs.page_url }}
        run: |
          set -u
          node - <<'NODE'
          const fs = require('fs');
          const env = process.env;
          const ok = (value) => value === 'success';
          const attempts = (list) => list.filter((value) => value && value !== 'skipped').length;
          const readAttempts = () => {
            try { return Number(fs.readFileSync('.chain-data-attempts', 'utf8').trim()) || 0; } catch (e) { return 0; }
          };
          const dataAttempts = readAttempts() || (env.DATA_OUTCOME === 'success' ? 1 : 0);
          const artifactAttempts = attempts([env.ARTIFACT_1, env.ARTIFACT_2]);
          const deployAttempts = attempts([env.DEPLOY_1, env.DEPLOY_2, env.DEPLOY_3]);
          const chainStart = (() => { try { return fs.readFileSync('.chain-start', 'utf8').trim(); } catch (e) { return ''; } })();
          const entry = {
            at: new Date().toISOString(),
            started_at: chainStart || '',
            duration_ms: chainStart ? (Date.now() - Date.parse(chainStart)) : 0,
            commit: String(env.SHA || '').slice(0, 7),
            run: env.RUN_ID || '',
            data: { attempts: dataAttempts, ok: ok(env.DATA_OUTCOME) || env.DATA_OUTCOME === 'skipped' },
            artifact: { attempts: artifactAttempts, ok: ok(env.ARTIFACT_1) || ok(env.ARTIFACT_2) || artifactAttempts === 0 },
            deploy: { attempts: deployAttempts, ok: ok(env.DEPLOY_1) || ok(env.DEPLOY_2) || ok(env.DEPLOY_3) || deployAttempts === 0 },
            url: env.PAGE_URL || '',
          };
          let log = [];
          try { log = JSON.parse(fs.readFileSync('chain-log.json', 'utf8')); } catch (e) { log = []; }
          if (!Array.isArray(log)) log = [];
          log.push(entry);
          fs.writeFileSync('chain-log.json', JSON.stringify(log.slice(-60), null, 1) + '\n');
          console.log('ثبت شد: ' + JSON.stringify(entry));
          NODE

          git config user.name "news-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add chain-log.json
          git commit -m "ثبت وضعیت اجرای زنجیره" >/dev/null 2>&1 || echo "رکورد جدیدی برای ثبت نبود"
          if [ -n "${LOG_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${LOG_TOKEN}@github.com/${REPO}.git"
            git push origin HEAD:main || {
              git pull --rebase origin main && git push origin HEAD:main
            } || echo "ثبت وضعیت در مخزن ناموفق بود" >&2
          else
            echo "توکن ثبت وضعیت تنظیم نشده؛ فقط در همین اجرا ثبت شد." >&2
          fi

      - name: زمان‌بندی اجرای بعدی
        # حتی اگر انتشار یا تولید داده شکست بخورد، حلقهٔ خودکار متوقف نشود
        # (اما با لغو دستی اجرا، اجرای بعدی زمان‌بندی نشود).
        if: ${{ !cancelled() }}
        env:
          DISPATCH_TOKEN: ${{ secrets.NEWS_RADAR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "خواب ۱۳ دقیقه تا اجرای بعدی…"
          sleep 780
          response=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP ${response}"
          if [ "${response}" != "204" ]; then
            echo "زنجیره قطع شد؛ تریگر زمان‌بندی/دستی لازم است" >&2
            exit 1
          fi
