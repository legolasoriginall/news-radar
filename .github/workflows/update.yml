name: به‌روزرسانی خودکار اخبار

on:
  # تریگر خارجی برای زمان‌بندی پایدار (وقتی cron گیت‌هاب کار نکند)
  repository_dispatch:
    types: [update-news]
  schedule:
    # هر ۱۵ دقیقه؛ GitHub ممکن است اجراهای cron را چند دقیقه با تأخیر اجرا کند
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/sources.mjs'
      - 'pipeline.mjs'
      - 'src/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نگه‌داشتن حافظهٔ ترجمه بین اجراها
        uses: actions/cache@v4
        with:
          path: .cache
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-

      - name: تولید داده‌ها
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: node pipeline.mjs

      - name: انتشار تغییرات
        run: |
          set -u
          git config user.name "news-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json index.html news.xlsx
          if git diff --cached --quiet; then
            echo "تغییری برای انتشار نیست"
            exit 0
          fi
          git commit -m "به‌روزرسانی خودکار اخبار و تحلیل"
          for attempt in 1 2 3; do
            echo "تلاش $attempt برای انتشار"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "همگام‌سازی ناموفق بود؛ تلاش مجدد"
              git rebase --abort || true
              git fetch origin main
              sleep 5
              continue
            fi
            if git push origin HEAD:main; then
              echo "انتشار با موفقیت انجام شد"
              exit 0
            fi
            sleep 5
          done
          echo "انتشار پس از سه تلاش ناموفق بود" >&2
          exit 1
