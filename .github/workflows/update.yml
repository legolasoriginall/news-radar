name: به‌روزرسانی خودکار اخبار

on:
  # زنجیرهٔ خودکار: هر اجرا، اجرای بعدی را ۱۳ دقیقه بعد شروع می‌کند
  workflow_dispatch:
  repository_dispatch:
    types: [update-news]
  # پشتیبان: اگر زمان‌بندی گیت‌هاب بالاخره فعال شود
  schedule:
    - cron: '*/15 * * * *'
  # راه‌اندازی اولیه/بازیابی با تغییر کد
  push:
    branches: [main]
    paths:
      - 'pipeline.mjs'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/update.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: news-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نگه‌داشتن حافظهٔ ترجمه بین اجراها
        uses: actions/cache@v4
        with:
          path: .cache
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-

      - name: تست زنجیرهٔ منابع نرخ
        run: npm test

      - name: تولید داده‌ها
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: node pipeline.mjs

      - name: آماده‌سازی سایت
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp data.json _site/
          cp news.xlsx _site/
          ls -lh _site

      - name: پیکربندی Pages
        uses: actions/configure-pages@v5

      - name: بارگذاری artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: انتشار روی Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: زمان‌بندی اجرای بعدی
        env:
          DISPATCH_TOKEN: ${{ secrets.NEWS_RADAR_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "خواب ۱۳ دقیقه تا اجرای بعدی…"
          sleep 780
          response=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/update.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP ${response}"
          if [ "${response}" != "204" ]; then
            echo "زنجیره قطع شد؛ تریگر زمان‌بندی/دستی لازم است" >&2
            exit 1
          fi
